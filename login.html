<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LEGACIA — Secure Access</title>


  <style>
    :root {
      --primary: #00f0ff;
      --accent: #ff00aa;
      --dark: #0a0015;
      --glass: rgba(30, 20, 80, 0.35);
      --glow: 0 0 35px rgba(0, 240, 255, 0.55);
      --glow-accent: 0 0 45px rgba(255, 0, 170, 0.55);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: radial-gradient(ellipse at center, #1a0033 0%, #000814 60%, #000000 100%);
      color: #f0f8ff;
      font-family: 'Roboto', system-ui, sans-serif;
      min-height: 100vh;
      background-attachment: fixed;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 90px;
      backdrop-filter: blur(20px);
      background: rgba(5,0,20,0.75);
      border-bottom: 1px solid rgba(0,240,255,0.18);
      z-index: 1000;
      padding: 0 6vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-container { display: flex; align-items: center; gap: 1.4rem; }

    .logo {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--primary);
      box-shadow: var(--glow);
      transition: all 0.7s;
    }

    .logo:hover { transform: scale(1.2) rotate(360deg); }

    .brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.9rem;
      font-weight: 900;
      background: linear-gradient(90deg, var(--primary), #a5f8ff, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 5px;
    }

    nav ul {
      display: flex;
      gap: 4.2rem;
      list-style: none;
      align-items: center;
    }

    nav a {
      color: #d8e8ff;
      text-decoration: none;
      font-weight: 500;
      font-size: 1.15rem;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 3px;
      bottom: -9px;
      left: 0;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.4s ease;
    }

    nav a:hover::after { width: 100%; }
    nav a:hover { color: var(--primary); }

    .login-btn {
      padding: 12px 36px;
      border-radius: 50px;
      background: linear-gradient(45deg, var(--accent), #ff4db8);
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: var(--glow-accent);
      transition: all 0.45s;
    }

    .login-btn:hover {
      transform: translateY(-5px) scale(1.08);
      box-shadow: 0 0 55px rgba(255,0,170,0.8);
    }

    .login-hero {
      margin-top: 20px;
      text-align: center;
    }

    .login-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(4rem, 10vw, 7rem);
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff, var(--primary), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1.5rem;
      letter-spacing: -1px;
    }

    .login-form-container {
      width: 520px;
      padding: 3.5rem 2.5rem;
      background: var(--glass);
      backdrop-filter: blur(18px);
      border: 2px solid rgba(0,240,255,0.3);
      border-radius: 28px;
      box-shadow: var(--glow), 0 0 60px rgba(255,0,170,0.25);
      transition: all 0.5s ease;
    }

    .login-form-container:hover {
      border-color: var(--primary);
      box-shadow: 0 0 80px rgba(0,240,255,0.6), 0 0 100px rgba(255,0,170,0.4);
    }

    .form-group {
      margin-bottom: 2rem;
      text-align: center;
    }

    .form-group label {
      font-family: 'Orbitron', sans-serif;
      color: var(--primary);
      font-size: 1.6rem;
      margin-bottom: 0.8rem;
      display: block;
    }

    .form-group input {
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 1.3rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(0,240,255,0.4);
      border-radius: 50px;
      color: white;
      transition: all 0.4s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 20px rgba(0,240,255,0.6);
      background: rgba(255,255,255,0.12);
    }

    .submit-btn {
      width: 100%;
      padding: 1.2rem;
      margin-top: 1.5rem;
      font-size: 1.4rem;
      font-weight: 600;
      background: linear-gradient(45deg, var(--primary), #00c0e0);
      color: #000;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: var(--glow);
      transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
    }

    .submit-btn:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 70px rgba(0,240,255,0.8);
    }

    .forgot-link,
    .signup-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 1.2rem;
      transition: color 0.3s;
    }

    .forgot-link:hover,
    .signup-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .account-text {
      margin: 1.5rem 0;
      font-size: 1.1rem;
      color: #c0d8ff;
      text-align: center;
    }

    .back-btn {
      margin: 4rem 0 2rem;
      padding: 1.2rem 4rem;
      font-size: 1.5rem;
      background: linear-gradient(45deg, var(--accent), #ff4db8);
      color: white;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: var(--glow-accent);
      transition: all 0.4s;
      text-decoration: none;
      display: inline-block;
    }

    .back-btn:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 80px rgba(255,0,170,0.7);
    }

    footer {
      margin-top: auto;
      padding: 4rem 0;
      text-align: center;
      color: #777;
      font-size: 1rem;
      border-top: 1px solid rgba(0,240,255,0.1);
    }
    .container1 {
      width: 100%;
      height: 100px;
      overflow: hidden;
      position: relative;
      background-color: transparent;
      margin-top: 100px;
      

    }

    .countries {
      display: inline-block;
      height: 40px;
      white-space: nowrap;
      font-size: 22px;
      animation: moveLeft 50s linear infinite;
      

    }
    .country {
      
       width: 58px;
            height: 58px;
            border-radius: 50%;

            border: 2px solid var(--primary);
            box-shadow: var(--glow);
            margin-top: 15px;
            margin-left: 30px;
      transition: transform 0.2s ease;
    }
    .country:hover {
     transform: translateY(-5px) rotate(360deg) scale(1.30);
     border-radius: 60px;
    }


    @keyframes moveLeft {
      0% {
        transform: translateX(100vw);  
      }
      100% {
        transform: translateX(-100%);   
      }
    }
  </style>
</head>
