<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LEGACIA — Create Account</title>

 

  <style>
    :root {
      --primary: #00f0ff;
      --accent: #ff00aa;
      --dark: #0a0015;
      --glass: rgba(30, 20, 80, 0.38);
      --glow: 0 0 35px rgba(0, 240, 255, 0.6);
      --glow-accent: 0 0 50px rgba(255, 0, 170, 0.6);
    }

    * { 
      margin:0; 
      padding:0; 
      box-sizing:border-box; 
    }

    body {
      background: radial-gradient(ellipse at center, #1a0033 0%, #000814 60%, #000000 100%);
      color: #f0f8ff;
      font-family: 'Roboto', system-ui, sans-serif;
      min-height: 100vh;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 90px;
      backdrop-filter: blur(20px);
      background: rgba(5,0,20,0.78);
      border-bottom: 1px solid rgba(0,240,255,0.2);
      z-index: 1000;
      padding: 0 6vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-container {
       display: flex; 
       align-items: center; 
       gap: 1.5rem; 
      }

    .logo {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--primary);
      box-shadow: var(--glow);
      transition: all 0.7s;
    }

    .logo:hover { transform: scale(1.2) rotate(360deg); }

    .brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(90deg, var(--primary), #a5f8ff, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 5px;
    }
    nav ul {
      display: flex;
      gap: 4.2rem;
      list-style: none;
      align-items: center;
    }

    nav a {
      color: #d8e8ff;
      text-decoration: none;
      font-weight: 500;
      font-size: 1.15rem;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 3px;
      bottom: -9px;
      left: 0;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.4s ease;
    }

    nav a:hover::after { width: 100%; }
    nav a:hover { color: var(--primary); }

    .login-btn {
      padding: 12px 36px;
      border-radius: 50px;
      background: linear-gradient(45deg, var(--accent), #ff4db8);
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: var(--glow-accent);
      transition: all 0.45s;
    }

    .login-btn:hover {
      transform: translateY(-5px) scale(1.08);
      box-shadow: 0 0 55px rgba(255,0,170,0.8);
    }
    main {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 100px; 
}


    .signup-hero {
      margin-top: 20px;
      text-align: center;
    }

    .signup-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(4.5rem, 11vw, 8rem);
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff, var(--primary), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1.2rem;
    }

    .signup-subtitle {
      font-size: 1.5rem;
      color: #c0d8ff;
      max-width: 680px;
      margin: 0 auto 3rem;
    }

    .signup-form-container {
      width: 540px;
      padding: 4rem 3rem;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 2px solid rgba(0,240,255,0.35);
      border-radius: 32px;
      box-shadow: var(--glow), 0 0 70px rgba(255,0,170,0.3);
      transition: all 0.5s ease;
    }

    .signup-form-container:hover {
      border-color: var(--primary);
      box-shadow: 0 0 90px rgba(0,240,255,0.7), 0 0 120px rgba(255,0,170,0.45);
    }

    .form-group {
      margin-bottom: 2.2rem;
      text-align: center;
    }

    .form-group label {
      font-family: 'Orbitron', sans-serif;
      color: var(--primary);
      font-size: 1.7rem;
      margin-bottom: 0.9rem;
      display: block;
    }

    .form-group input {
      width: 100%;
      padding: 1.1rem 1.8rem;
      font-size: 1.35rem;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(0,240,255,0.45);
      border-radius: 50px;
      color: white;
      transition: all 0.4s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 25px rgba(0,240,255,0.7);
      background: rgba(255,255,255,0.14);
    }

    .submit-btn {
      width: 100%;
      padding: 1.3rem;
      margin-top: 2rem;
      font-size: 1.5rem;
      font-weight: 600;
      background: linear-gradient(45deg, var(--primary), #00c0e0);
      color: #000;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: var(--glow);
      transition: all 0.45s cubic-bezier(0.16,1,0.3,1);
    }

    .submit-btn:hover {
      transform: translateY(-7px);
      box-shadow: 0 0 80px rgba(0,240,255,0.85);
    }

    .social-title {
      text-align: center;
      color: var(--primary);
      font-size: 1.6rem;
      margin: 2.5rem 0 1.5rem;
      font-family: 'Orbitron', sans-serif;
    }

    .social-buttons {
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      margin-bottom: 2rem;
    }

    .social-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid rgba(0,240,255,0.4);
      background: rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.4s;
    }

    .social-btn img {
      width: 42px;
      height: 42px;
    }

    .social-btn:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
      box-shadow: 0 0 30px rgba(0,240,255,0.6);
    }

    .account-text {
      text-align: center;
      font-size: 1.25rem;
      color: #c0d8ff;
      margin-top: 1.8rem;
    }

    .login-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .login-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .back-btn {
      margin: 100px 100px 100px 100px;
      padding: 1.3rem 5rem;
      font-size: 1.6rem;
      background: linear-gradient(45deg, var(--accent), #ff4db8);
      color: white;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: var(--glow-accent);
      transition: all 0.45s;
      
    }

    .back-btn:hover {
      transform: translateY(-7px);
      box-shadow: 0 0 90px rgba(255,0,170,0.8);
    }

    footer {
      margin-top: auto;
      padding: 5rem 0 3rem;
      text-align: center;
      color: #777;
      font-size: 1.1rem;
      border-top: 1px solid rgba(0,240,255,0.12);
    }
    .container1 {
      width: 100%;
      height: 100px;
      overflow: hidden;
      position: relative;
      background-color: transparent;
      margin-top: 100px;
      

    }

    .countries {
      display: inline-block;
      height: 40px;
      white-space: nowrap;
      font-size: 22px;
      animation: moveLeft 50s linear infinite;
      

    }
    .country {
      
       width: 58px;
            height: 58px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            box-shadow: var(--glow);
            margin-top: 15px;
            margin-left: 30px;
      transition: transform 0.2s ease;
    }
    .country:hover {
     transform: translate(-5px) rotate(360deg) scale(1.30);
     border-radius: 60px;
    }


    @keyframes moveLeft {
      0% {
        transform: translateX(100vw);  
      }
      100% {
        transform: translateX(-100%);   
      }
    }
  </style>
</head>

<main>

  <section class="signup-hero">
    <h1 class="signup-title">CREATE ACCOUNT</h1>
    <p class="signup-subtitle">Join the future of sovereign intelligence & next-generation technology</p>
  </section>

  <div class="signup-form-container">
    <form id="contactForm" method="POST">
      <div class="form-group">
        <label for="name">Username</label>
        <input type="text" id="name" name="name" placeholder="legacia_official" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create strong password" required>
      </div>

      <button type="submit" class="submit-btn">SIGN UP</button>
    </form>

    <h2 class="social-title">Or signup with</h2>

    <div class="social-buttons">
      <div class="social-btn" title="Google">
        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google">
      </div>
      <div class="social-btn" title="GitHub">
        <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub">
      </div>
      <div class="social-btn" title="Microsoft">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="Microsoft">
      </div>
    </div>

    <p class="account-text">
      Already have an account? <a href="login.html" class="login-link">Login</a>
    </p>
  </div>
